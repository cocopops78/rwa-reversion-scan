name: reversion-scan

# Sampler de microstructure multi-venues (base=lighter x hedges), keyless, sur runner Actions.
# Manuel (Actions -> Run workflow). Cap GitHub-hosted = 6h/job -> couverture ~8h via 2 legs
# sequentiels (legA -> legB), chacun ~4h ; job "combine" fusionne + analyse.

on:
  workflow_dispatch:
    inputs:
      minutes_per_leg:
        description: "Minutes par leg (2 legs sequentiels A->B ; couverture ~= 2x ; max 350/leg sous cap 6h)"
        default: "240"
      hedges:
        description: "Venues hedge contre lighter"
        default: "extended,variational,hl-xyz"
      symbols:
        description: "Symboles (vide = tout l'univers)"
        default: ""
      lighter_gap:
        description: "Throttle lighter : s entre 2 refresh/symbole"
        default: "25"
      interval:
        description: "Intervalle entre rounds (s)"
        default: "5"

jobs:
  legA:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Probe lighter
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://mainnet.zklighter.elliot.ai/api/v1/orderBookDetails)
          echo "lighter /orderBookDetails -> HTTP $code"
          [ "$code" = "200" ] || echo "::warning::runner IP -> HTTP $code (couloirs lighter vides ce leg)"
      - name: Scan leg A
        env:
          MIN: ${{ inputs.minutes_per_leg }}
          HED: ${{ inputs.hedges }}
          SYM: ${{ inputs.symbols }}
          LG: ${{ inputs.lighter_gap }}
          IV: ${{ inputs.interval }}
        run: |
          A="--mode crossing --base lighter --hedges $HED --minutes $MIN --interval $IV --lighter-gap $LG --csv partA.csv --checkpoint-min 20"
          if [ -n "$SYM" ]; then A="$A --symbols $SYM"; fi
          python3 tools/builder_depth.py $A
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-a
          path: partA.csv
          if-no-files-found: warn

  legB:
    needs: legA
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Scan leg B
        env:
          MIN: ${{ inputs.minutes_per_leg }}
          HED: ${{ inputs.hedges }}
          SYM: ${{ inputs.symbols }}
          LG: ${{ inputs.lighter_gap }}
          IV: ${{ inputs.interval }}
        run: |
          B="--mode crossing --base lighter --hedges $HED --minutes $MIN --interval $IV --lighter-gap $LG --csv partB.csv --checkpoint-min 20"
          if [ -n "$SYM" ]; then B="$B --symbols $SYM"; fi
          python3 tools/builder_depth.py $B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-b
          path: partB.csv
          if-no-files-found: warn

  combine:
    needs: [legA, legB]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Merge + analyse
        run: |
          : > reversion.csv
          if [ -f dl/part-a/partA.csv ]; then cat dl/part-a/partA.csv >> reversion.csv; fi
          if [ -f dl/part-b/partB.csv ]; then cat dl/part-b/partB.csv >> reversion.csv; fi
          if [ -s reversion.csv ]; then
            python3 tools/reversion_analyze.py reversion.csv | tee reversion_report.txt
          else
            echo "pas de donnees"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversion-${{ github.run_id }}
          path: |
            reversion.csv
            reversion_report.txt
          if-no-files-found: warn
